name: MINE-ME native installable builds

on:
  push:
    branches:
      - feature/mine-me-installable-app
  workflow_dispatch:

concurrency:
  group: mine-me-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
            artifact: android-apk
          - os: windows-latest
            target: windows
            artifact: windows-desktop
          - os: ubuntu-latest
            target: linux
            artifact: linux-desktop
          - os: macos-latest
            target: macos
            artifact: macos-desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Generate native platform runners
        run: flutter create --org com.mineme --platforms=android,windows,linux,macos .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build native RandomX library for Android
        if: matrix.target == 'apk'
        shell: bash
        run: |
          NDK_PATH=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          cmake -S native/randomx -B build/randomx-android -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/randomx-android --target mine_me_randomx --parallel 2
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/randomx-android/libmine_me_randomx.so android/app/src/main/jniLibs/arm64-v8a/
      - name: Build native RandomX library for Windows
        if: matrix.target == 'windows'
        run: |
          cmake -S native/randomx -B build/randomx-windows -A x64
          cmake --build build/randomx-windows --config Release --target mine_me_randomx --parallel 2
      - name: Build native RandomX library for Linux
        if: matrix.target == 'linux'
        run: |
          cmake -S native/randomx -B build/randomx-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/randomx-linux --target mine_me_randomx --parallel 2
      - name: Build native RandomX library for macOS
        if: matrix.target == 'macos'
        run: |
          cmake -S native/randomx -B build/randomx-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build/randomx-macos --target mine_me_randomx --parallel 2
      - name: Build release
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "apk" ]]; then
            flutter build apk --release --target-platform android-arm64
          else
            flutter build "${{ matrix.target }}" --release
          fi
      - name: Bundle native RandomX library on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Copy-Item build/randomx-windows/Release/mine_me_randomx.dll build/windows/x64/runner/Release/
      - name: Bundle native RandomX library on Linux
        if: matrix.target == 'linux'
        run: cp build/randomx-linux/libmine_me_randomx.so build/linux/x64/release/bundle/
      - name: Bundle native RandomX library on macOS
        if: matrix.target == 'macos'
        run: |
          mkdir -p build/macos/Build/Products/Release/mine_me_native.app/Contents/Frameworks
          cp build/randomx-macos/libmine_me_randomx.dylib build/macos/Build/Products/Release/mine_me_native.app/Contents/Frameworks/
      - name: Create Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/mine-me.iss
      - name: Create Linux Debian installer
        if: matrix.target == 'linux'
        run: bash packaging/linux/build-deb.sh
      - name: Create macOS disk image
        if: matrix.target == 'macos'
        run: |
          mkdir -p build/installers build/macos/Build/Products/Release/mine_me_native.app/Contents/Resources
          cp THIRD_PARTY_NOTICES.md build/macos/Build/Products/Release/mine_me_native.app/Contents/Resources/
          hdiutil create -volname MINE-ME -srcfolder build/macos/Build/Products/Release/mine_me_native.app -ov -format UDZO build/installers/MINE-ME-macOS.dmg
      - name: Upload Android APK
        if: matrix.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-android-apk
          path: apps/native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows installer bundle
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-windows-desktop
          path: apps/native/build/installers/MineMe-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux bundle
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-linux-desktop
          path: apps/native/build/installers/mine-me_0.2.0_amd64.deb
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS application bundle
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-macos-desktop
          path: apps/native/build/installers/MINE-ME-macOS.dmg
          if-no-files-found: error
          retention-days: 14
