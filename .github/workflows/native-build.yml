name: MINE-ME native installable builds

on:
  push:
    branches:
      - feature/mine-me-installable-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
            artifact: android-apk
          - os: windows-latest
            target: windows
            artifact: windows-desktop
          - os: ubuntu-latest
            target: linux
            artifact: linux-desktop
          - os: macos-latest
            target: macos
            artifact: macos-desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate native platform runners
        run: flutter create --platforms=android,windows,linux,macos .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build release
        run: flutter build ${{ matrix.target }} --release
      - name: Upload Android APK
        if: matrix.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-android-apk
          path: apps/native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer bundle
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-windows-desktop
          path: apps/native/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux bundle
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-linux-desktop
          path: apps/native/build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS application bundle
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: mine-me-macos-desktop
          path: apps/native/build/macos/Build/Products/Release/
          if-no-files-found: error
          retention-days: 14
